name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Build dashboard
        run: python frontend/build_web.py

      - name: Run frontend tests
        run: node --test --test-isolation=none frontend/tests/*.test.mjs

      - name: Check output safety and core examples
        run: |
          python -B frontend/tests/output-safety.test.py
          python -B frontend/tests/verify-core-examples.py

      - name: Check generated JavaScript syntax
        run: |
          for file in frontend/dist/*.js; do
            node --check "$file"
          done

      - name: Run Python tests including the local launcher
        run: python -m pytest -q tests frontend/tests/test_local_launcher.py
